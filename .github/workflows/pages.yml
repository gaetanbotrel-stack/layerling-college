name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Static export (simple mode, sub-folder base path)
        run: npm run export
        env:
          LAYERLING_BASE_PATH: /layerling-college
          LAYERLING_EDITOR_PROFILE: '{"version":1,"base":"simple","tools":{}}'
          LAYERLING_TYPES_CHECKED: "1"

      - name: Disable Jekyll
        run: touch apps/web/.next-export/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/.next-export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
